user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format klinikaid_json escape=json
        '{"ts":"$time_iso8601","source":"proxy","request_id":"$request_id",'
        '"remote_addr":"$remote_addr","method":"$request_method","path":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
        '"upstream_s":"$upstream_response_time","scheme":"$scheme","user_agent":"$http_user_agent"}';
    access_log  /var/log/nginx/access.log  klinikaid_json;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 12m;
    merge_slashes   on;

    include /etc/nginx/conf.d/*.conf;
}
