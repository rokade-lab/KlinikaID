resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;

server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/snippets/https-port.conf;

    location / {
        return 301 https://$host$klinikaid_https_suffix$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.pem;
    ssl_certificate_key /etc/nginx/tls/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:klinikaid_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    include /etc/nginx/snippets/security-headers.conf;

    location ~ /\. {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    location ~* \.(php|phtml|phar)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        root /srv/klinikaid/public;
        try_files $uri =404;
        autoindex off;
        expires 1h;
        location ~ /\. { return 404; }
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        set $klinikaid_upstream app:9000;
        fastcgi_pass $klinikaid_upstream;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param PATH_INFO "";
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header X-Request-Id;
        fastcgi_hide_header Strict-Transport-Security;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_hide_header Content-Security-Policy;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_read_timeout 60s;
        fastcgi_intercept_errors off;
    }
}
